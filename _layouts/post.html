---
layout: default
---

<article class="post">

    <h1>{{ page.title }}</h1>
    {% assign chars = page.content | smart_word_count %}
    <div class="post-info">
        {{ page.date | date: "%Y-%m-%d" }}
        · {{ chars }} 字
    </div>

    {% if page.excerpt %}
    <div class="post-summary">
        {{ page.excerpt | markdownify }}
    </div>
    {% endif %}

    <div class="post-content">
        {{ content }}
    </div>

</article>
